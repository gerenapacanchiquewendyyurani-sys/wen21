<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Semáforo y Carro</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#d8dde2;
    overflow:hidden;
}

/* Escenario */
.CASE{
    width:100%;
    height:500px;
    background:url(ciudad.jpg);
    background-size:cover;
    position:relative;
}

/* Semáforo */
.semaforo{
    width:90px;
    background:#222;
    border-radius:10px;
    padding:10px;
    position:absolute;
    left:50%;
    top:80px;
    transform:translateX(-50%);
}

.luz{
    width:70px;
    height:70px;
    border-radius:50%;
    margin:10px auto;
    opacity:.2;
}

/* Luces */
.rojo{
    background:red;
    animation:rojo 9s infinite;
}

.amarillo{
    background:yellow;
    animation:amarillo 9s infinite;
}

.verde{
    background:lime;
    animation:verde 9s infinite;
}

/* Carro */
.carro{
    width:220px;
    position:absolute;
    bottom:40px;
    left:0;
    animation:mover 9s infinite linear;
}

/* Animación del carro */
@keyframes mover{

    /* Avanza hasta el semáforo */
    0%{
        left:0;
    }

    30%{
        left:42%;
    }

    /* Se queda esperando */
    60%{
        left:42%;
    }

    /* Cuando el semáforo está verde continúa */
    100%{
        left:100%;
    }
}

/* Semáforo */

@keyframes rojo{
    0%,33%{
        opacity:1;
    }
    34%,100%{
        opacity:.2;
    }
}

@keyframes amarillo{
    0%,33%{
        opacity:.2;
    }
    34%,50%{
        opacity:1;
    }
    51%,100%{
        opacity:.2;
    }
}

@keyframes verde{
    0%,50%{
        opacity:.2;
    }
    51%,100%{
        opacity:1;
    }
}
</style>
</head>

<body>

<div class="CASE">

    <div class="semaforo">
        <div class="luz rojo"></div>
        <div class="luz amarillo"></div>
        <div class="luz verde"></div>
    </div>

    <!-- Usa un PNG sin fondo -->
    <img src="m1r.png" class="carro">

</div>

</body>
</html>
